<div class="login-container">
  <mat-card class="login-card">
    <mat-card-content>
      <div class="back-link">← Volver</div>
      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-sub">Accede a la plataforma de Confecciones con tu usuario.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Admin" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" placeholder="••••••" />
        </mat-form-field>

        <div *ngIf="error" class="error">{{ error }}</div>

        <button mat-raised-button type="submit" [disabled]="loading" class="full login-btn">Ingresar</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
