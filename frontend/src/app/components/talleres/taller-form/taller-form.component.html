<h2 mat-dialog-title>{{ isEdit ? 'Editar Taller' : 'Nuevo Taller' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="taller-form">
    <div class="form-row">
      <mat-form-field>
        <mat-label>Código</mat-label>
        <input matInput formControlName="codigo" required placeholder="Ej: TALL-001">
        <mat-hint>Identificador único del taller</mat-hint>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" required placeholder="Ej: Taller Principal">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field class="full-width">
        <mat-label>Dirección</mat-label>
        <input matInput formControlName="direccion" placeholder="Ej: Calle 123 #45-67">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field>
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="telefono" type="tel" placeholder="Ej: 3001234567">
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Contacto</mat-label>
        <input matInput formControlName="contacto" placeholder="Ej: Juan Pérez">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field>
        <mat-label>Capacidad Diaria</mat-label>
        <input matInput type="number" formControlName="capacidad_diaria" required min="0" placeholder="Ej: 100">
        <mat-hint>Prendas por día</mat-hint>
      </mat-form-field>
    </div>

    <mat-checkbox formControlName="activo">Taller Activo</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="!form.valid">
    Guardar
  </button>
</mat-dialog-actions>
