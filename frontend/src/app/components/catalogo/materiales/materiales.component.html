<div class="materiales-container">
  <div class="header-actions">
    <h2>
      <mat-icon>texture</mat-icon>
      Materiales
    </h2>
    <button mat-raised-button color="primary" (click)="nuevoMaterial()">
      <mat-icon>add</mat-icon>
      Nuevo Material
    </button>
  </div>

  <mat-card *ngIf="loading">
    <mat-card-content>
      <mat-spinner></mat-spinner>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="!loading">
    <mat-card-content>
      <table mat-table [dataSource]="materiales" class="mat-elevation-z2">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let material">{{ material.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let material">{{ material.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let material">{{ material.descripcion || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let material">
            <mat-chip [color]="material.activo ? 'primary' : 'warn'">
              {{ material.activo ? 'Sí' : 'No' }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let material">
            <button mat-icon-button class="action-button" matTooltip="Editar" aria-label="Editar material" (click)="editarMaterial(material)">
              <mat-icon color="primary">edit</mat-icon>
            </button>
            <button mat-icon-button class="action-button" matTooltip="Eliminar" aria-label="Eliminar material" (click)="eliminarMaterial(material)">
              <mat-icon color="warn">delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
