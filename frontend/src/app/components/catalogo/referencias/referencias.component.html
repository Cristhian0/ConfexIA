<div class="referencias-container">
  <div class="header-actions">
    <h2>
      <mat-icon>style</mat-icon>
      Referencias
    </h2>
    <button mat-raised-button color="primary" (click)="nuevaReferencia()">
      <mat-icon>add</mat-icon>
      Nueva Referencia
    </button>
  </div>

  <mat-card *ngIf="loading">
    <mat-card-content>
      <mat-spinner></mat-spinner>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="!loading">
    <mat-card-content>
      <table mat-table [dataSource]="referencias" class="mat-elevation-z2">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let referencia">{{ referencia.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let referencia">{{ referencia.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let referencia">{{ referencia.descripcion || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="es_pedido_especial">
          <th mat-header-cell *matHeaderCellDef>Pedido Especial</th>
          <td mat-cell *matCellDef="let referencia">
            <mat-chip [color]="referencia.es_pedido_especial ? 'accent' : 'basic'">
              {{ referencia.es_pedido_especial ? 'Sí' : 'No' }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let referencia">
            <mat-chip [color]="referencia.activo ? 'primary' : 'warn'">
              {{ referencia.activo ? 'Sí' : 'No' }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let referencia">
            <button mat-icon-button class="action-button" matTooltip="Editar" aria-label="Editar referencia" (click)="editarReferencia(referencia)">
              <mat-icon color="primary">edit</mat-icon>
            </button>
            <button mat-icon-button class="action-button" matTooltip="Eliminar" aria-label="Eliminar referencia" (click)="eliminarReferencia(referencia)">
              <mat-icon color="warn">delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
